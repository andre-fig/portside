name: Verify Railway

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-api:
    name: Verify Railway API
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Wait for Railway API healthcheck
        env:
          API_URL: https://api-production-6d06.up.railway.app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "Railway API is healthy."
              exit 0
            fi
            echo "Waiting for Railway deployment (attempt $attempt/30)..."
            sleep 10
          done
          echo "Railway API did not become healthy in time."
          exit 1
