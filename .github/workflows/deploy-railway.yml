name: Deploy Railway

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, sync-worker, upstream-cron]
    env:
      RAILWAY_PROJECT_ID: c948dfee-f2e0-47f9-9ede-39283181c3bd
      RAILWAY_ENVIRONMENT: production
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Apply database migrations
        if: ${{ matrix.service == 'api' }}
        run: railway run --service api --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" -- npm --prefix backend run prisma:migrate:deploy
      - name: Deploy service
        run: railway up --service "${{ matrix.service }}" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --detach --yes
