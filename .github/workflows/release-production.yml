name: Release Portside

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the main branch
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -eu
          test "$TARGET_REF" = "refs/heads/main" || {
            echo "Production releases must be started from main (received $TARGET_REF)." >&2
            exit 1
          }

      - name: Find successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -eu
          ci_run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=20" \
            --jq '.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success") | .id' \
            | head -n 1)"
          test -n "$ci_run_id" || {
            echo "No successful CI run was found for commit ${TARGET_SHA}." >&2
            echo "Wait for CI to finish, then start the release again." >&2
            exit 1
          }

          passed="$(gh run view "$ci_run_id" --json jobs \
            --jq '[.jobs[] | select(.name == "Production source policy" or .name == "Backend schema and build")] | length == 2 and all(.[]; .conclusion == "success")')"
          test "$passed" = true || {
            echo "CI run $ci_run_id did not pass all required jobs." >&2
            exit 1
          }
          echo "Using successful CI run $ci_run_id for commit ${TARGET_SHA}."

  build-and-publish-production:
    name: Build, notarize and publish production release
    needs: [verify-ci]
    runs-on: macos-15
    timeout-minutes: 90
    environment: production
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      runtime_run_id: ${{ steps.runtime.outputs.runtime_run_id }}
    env:
      PORTSIDE_UPDATE_CHANNEL: production
      PORTSIDE_API_BASE_URL: ${{ secrets.PORTSIDE_API_BASE_URL }}
      PORTSIDE_UPDATE_FEED_URL: ${{ secrets.PORTSIDE_UPDATE_FEED_URL }}
      PORTSIDE_SPARKLE_PUBLIC_KEY: ${{ secrets.PORTSIDE_SPARKLE_PUBLIC_KEY }}
      PORTSIDE_RUNTIME_MANIFEST_PUBLIC_KEY: ${{ secrets.PORTSIDE_RUNTIME_MANIFEST_PUBLIC_KEY }}
      PORTSIDE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY_ID }}
      PORTSIDE_LICENSE_PUBLIC_KEY: ${{ secrets.PORTSIDE_LICENSE_PUBLIC_KEY }}
      PORTSIDE_LICENSE_KEY_ID: ${{ secrets.PORTSIDE_LICENSE_KEY_ID }}
      PORTSIDE_ARTIFACT_HOSTS: ${{ secrets.PORTSIDE_ARTIFACT_HOSTS }}
      PORTSIDE_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_PUBLIC_BUCKET }}
      PORTSIDE_SECONDARY_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_SECONDARY_PUBLIC_BUCKET }}
      PORTSIDE_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_S3_ACCESS_KEY_ID }}
      PORTSIDE_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_S3_REGION: ${{ secrets.PORTSIDE_S3_REGION }}
      PORTSIDE_S3_ENDPOINT: ${{ secrets.PORTSIDE_S3_ENDPOINT }}
      PORTSIDE_SECONDARY_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_SECONDARY_S3_ACCESS_KEY_ID }}
      PORTSIDE_SECONDARY_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_SECONDARY_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_SECONDARY_S3_REGION: ${{ secrets.PORTSIDE_SECONDARY_S3_REGION }}
      PORTSIDE_SECONDARY_S3_ENDPOINT: ${{ secrets.PORTSIDE_SECONDARY_S3_ENDPOINT }}
      PORTSIDE_PUBLIC_BASE_URL: ${{ secrets.PORTSIDE_PUBLIC_BASE_URL }}
      PORTSIDE_CODESIGN_IDENTITY: ${{ secrets.PORTSIDE_CODESIGN_IDENTITY }}
      PORTSIDE_NOTARY_KEY_ID: ${{ secrets.PORTSIDE_NOTARY_KEY_ID }}
      PORTSIDE_NOTARY_ISSUER_ID: ${{ secrets.PORTSIDE_NOTARY_ISSUER_ID }}
      PORTSIDE_ADMIN_BEARER_TOKEN: ${{ secrets.PORTSIDE_ADMIN_BEARER_TOKEN }}
      PORTSIDE_CONFIRM_PRODUCTION: "YES"
    steps:
      - name: Check out tested sources
        uses: actions/checkout@v7

      - name: Ensure release storage client
        run: |
          set -eu
          command -v aws >/dev/null 2>&1 || brew install awscli

      - name: Select validated runtime artifact
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run_id="$(gh run list --workflow build-runtime.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != null
          gh run view "$run_id" --json workflowName,status,conclusion,headBranch \
            | jq -e '(.workflowName == "Build Portside Runtime" and .status == "completed" and .conclusion == "success" and .headBranch == "main")' >/dev/null
          metadata_artifact_name="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("portside-runtime-metadata-production-"))) | .name' | head -n 1)"
          full_artifact_name="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("portside-runtime-production-"))) | .name' | head -n 1)"
          if [ -n "$metadata_artifact_name" ]; then
            artifact_name="$metadata_artifact_name"
            artifact_kind=metadata
          else
            artifact_name="$full_artifact_name"
            artifact_kind=full
          fi
          test -n "$artifact_name"
          case "$artifact_name" in
            portside-runtime-metadata-production-*|portside-runtime-production-*) ;;
            *) echo "selected artifact is not a production runtime artifact" >&2; exit 1 ;;
          esac
          {
            printf 'runtime_run_id=%s\n' "$run_id"
            printf 'runtime_artifact_name=%s\n' "$artifact_name"
            printf 'runtime_artifact_kind=%s\n' "$artifact_kind"
          } >> "$GITHUB_OUTPUT"

      - name: Download previously validated runtime artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.runtime.outputs.runtime_run_id }}
          name: ${{ steps.runtime.outputs.runtime_artifact_name }}
          path: ${{ runner.temp }}/portside-release

      - name: Validate reused production runtime evidence
        id: runtime-evidence
        env:
          PORTSIDE_RUNTIME_BUILD_DIR: ${{ runner.temp }}/portside-release
          PORTSIDE_RUNTIME_ARTIFACT_KIND: ${{ steps.runtime.outputs.runtime_artifact_kind }}
        run: |
          set -eu
          test -s "$PORTSIDE_RUNTIME_BUILD_DIR/runtime-manifest-unsigned.json"
          test -s "$PORTSIDE_RUNTIME_BUILD_DIR/runtime-manifest.json"
          test -s "$PORTSIDE_RUNTIME_BUILD_DIR/provenance.json"
          test -s "$PORTSIDE_RUNTIME_BUILD_DIR/sbom.spdx.json"
          ./scripts/build-runtime/validate-manifest.sh "$PORTSIDE_RUNTIME_BUILD_DIR/runtime-manifest.json"
          runtime_version="$(jq -r '.manifestVersion' "$PORTSIDE_RUNTIME_BUILD_DIR/runtime-manifest-unsigned.json")"
          test -n "$runtime_version" && test "$runtime_version" != null
          if [ "$PORTSIDE_RUNTIME_ARTIFACT_KIND" = full ]; then
            for component in Wrapper WineEngine Winetricks; do
              test -s "$PORTSIDE_RUNTIME_BUILD_DIR/Portside${component}-${runtime_version}.tar.xz"
            done
            PORTSIDE_RUNTIME_VERSION="$runtime_version" \
              PORTSIDE_RUNTIME_BUILD_DIR="$PORTSIDE_RUNTIME_BUILD_DIR" \
              ./scripts/build-runtime/validate-clean-layout.sh
          fi
          printf 'runtime_version=%s\n' "$runtime_version" >> "$GITHUB_OUTPUT"

      - name: Set release version from validated runtime
        id: release-version
        env:
          VALIDATED_RUNTIME_VERSION: ${{ steps.runtime-evidence.outputs.runtime_version }}
          PORTSIDE_API_BASE_URL: ${{ secrets.PORTSIDE_API_BASE_URL }}
        run: |
          set -eu
          printf '%s\n' "$VALIDATED_RUNTIME_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          current_appcast="$RUNNER_TEMP/portside-current-appcast.xml"
          latest_app_version=""
          if curl --fail --silent --show-error --retry 3 \
            "$PORTSIDE_API_BASE_URL/v1/appcast.xml" \
            -o "$current_appcast"; then
            latest_app_version="$(node --input-type=module - "$current_appcast" <<'NODE'
          import { readFileSync } from 'node:fs';
          const xml = readFileSync(process.argv[2], 'utf8');
          const version = xml.match(/sparkle:version="([0-9]+\.[0-9]+\.[0-9]+)"/i)?.[1] ?? '';
          process.stdout.write(version);
          NODE
            )"
          fi
          release_version="$(
            RUNTIME_VERSION="$VALIDATED_RUNTIME_VERSION" \
            LATEST_APP_VERSION="$latest_app_version" \
            node --input-type=module <<'NODE'
          const parse = (value) => value.match(/^(\d+)\.(\d+)\.(\d+)$/)?.slice(1).map(Number) ?? null;
          const runtime = parse(process.env.RUNTIME_VERSION);
          const latest = parse(process.env.LATEST_APP_VERSION ?? '');
          if (!runtime) process.exit(1);
          let chosen = runtime;
          if (latest && (latest[0] > chosen[0] || (latest[0] === chosen[0] && (latest[1] > chosen[1] || (latest[1] === chosen[1] && latest[2] >= chosen[2]))))) {
            chosen = [latest[0], latest[1], latest[2] + 1];
          }
          process.stdout.write(chosen.join('.'));
          NODE
          )"
          printf 'PORTSIDE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Materialize CI-only signing inputs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.PORTSIDE_SPARKLE_PRIVATE_KEY }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY }}
        run: |
          set -eu
          umask 077
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$MANIFEST_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/portside-sparkle-ed25519.key"
          printf '%s' "$MANIFEST_PRIVATE_KEY" > "$RUNNER_TEMP/portside-manifest-ed25519.key"

      - name: Materialize App Store Connect notary key
        env:
          NOTARY_P8: ${{ secrets.PORTSIDE_NOTARY_P8 }}
          NOTARY_P8_BASE64: ${{ secrets.PORTSIDE_NOTARY_P8_BASE64 }}
        run: |
          set -eu
          umask 077
          notary_key_path="$RUNNER_TEMP/portside-notary-key.p8"
          if [ -n "$NOTARY_P8" ]; then
            printf '%s\n' "$NOTARY_P8" > "$notary_key_path"
          elif [ -n "$NOTARY_P8_BASE64" ]; then
            printf '%s' "$NOTARY_P8_BASE64" | base64 -D > "$notary_key_path"
          else
            echo "Missing PORTSIDE_NOTARY_P8" >&2
            exit 1
          fi
          test -s "$notary_key_path"
          openssl pkey -in "$notary_key_path" -noout
          printf 'PORTSIDE_NOTARY_KEY_PATH=%s\n' "$notary_key_path" >> "$GITHUB_ENV"

      - name: Validate release inputs without printing secrets
        run: |
          set -eu
          for value in "$PORTSIDE_VERSION" "$PORTSIDE_API_BASE_URL" "$PORTSIDE_UPDATE_FEED_URL" "$PORTSIDE_SPARKLE_PUBLIC_KEY" "$PORTSIDE_RUNTIME_MANIFEST_PUBLIC_KEY" "$PORTSIDE_LICENSE_PUBLIC_KEY" "$PORTSIDE_LICENSE_KEY_ID" "$PORTSIDE_ARTIFACT_HOSTS" "$PORTSIDE_PUBLIC_BASE_URL" "$PORTSIDE_CODESIGN_IDENTITY" "$PORTSIDE_NOTARY_KEY_ID" "$PORTSIDE_NOTARY_ISSUER_ID" "$PORTSIDE_NOTARY_KEY_PATH"; do
            test -n "$value"
            case "$value" in *example.invalid*) echo "placeholder release value" >&2; exit 1;; esac
          done

      - name: Preflight App Store Connect notary credentials
        run: |
          set -eu
          xcrun notarytool history \
            --key "$PORTSIDE_NOTARY_KEY_PATH" \
            --key-id "$PORTSIDE_NOTARY_KEY_ID" \
            --issuer "$PORTSIDE_NOTARY_ISSUER_ID" \
            --output-format json >/dev/null

      - name: Import Developer ID certificate into ephemeral keychain
        env:
          CODESIGN_P12_BASE64: ${{ secrets.PORTSIDE_CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.PORTSIDE_CODESIGN_P12_PASSWORD }}
          CODESIGN_CERT_PEM: ${{ secrets.PORTSIDE_CODESIGN_CERTIFICATE_PEM }}
          CODESIGN_CERT_BASE64: ${{ secrets.PORTSIDE_CODESIGN_CERTIFICATE_BASE64 }}
        run: |
          set -eu
          test -n "$CODESIGN_P12_BASE64"
          test -n "$CODESIGN_P12_PASSWORD"
          if [ -z "$CODESIGN_CERT_PEM" ] && [ -z "$CODESIGN_CERT_BASE64" ]; then
            echo "Missing Developer ID certificate secret" >&2
            exit 1
          fi
          SIGNING_KEYCHAIN="$RUNNER_TEMP/portside-signing.keychain-db"
          SIGNING_P12="$RUNNER_TEMP/portside-developer-id.p12"
          SIGNING_CERT="$RUNNER_TEMP/portside-developer-id.cer"
          SIGNING_PRIVATE_KEY="$RUNNER_TEMP/portside-developer-id-private.key"
          SIGNING_EMBEDDED_CERT="$RUNNER_TEMP/portside-developer-id-embedded.cer"
          SIGNING_COMBINED_P12="$RUNNER_TEMP/portside-developer-id-combined.p12"
          trap 'rm -f "$SIGNING_P12" "$SIGNING_CERT" "$SIGNING_PRIVATE_KEY" "$SIGNING_EMBEDDED_CERT" "$SIGNING_COMBINED_P12"' EXIT
          security create-keychain -p '' "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p '' "$SIGNING_KEYCHAIN"
          printf '%s' "$CODESIGN_P12_BASE64" | base64 -D > "$SIGNING_P12"
          if [ -n "$CODESIGN_CERT_PEM" ]; then
            printf '%s\n' "$CODESIGN_CERT_PEM" > "$SIGNING_CERT"
          else
            printf '%s' "$CODESIGN_CERT_BASE64" | base64 -D > "$SIGNING_CERT"
          fi
          if [ -n "$CODESIGN_CERT_PEM" ]; then
            openssl x509 -in "$SIGNING_CERT" -noout
          else
            openssl x509 -inform der -in "$SIGNING_CERT" -noout
          fi
          security import "$SIGNING_P12" -P "$CODESIGN_P12_PASSWORD" -A -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security import "$SIGNING_CERT" -A -f pemseq -t cert -k "$SIGNING_KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k '' "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security default-keychain -s "$SIGNING_KEYCHAIN"
          signing_identity="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          if [ -n "$signing_identity" ]; then
            printf 'PORTSIDE_CODESIGN_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
            exit 0
          fi
          export PORTSIDE_P12_PASSWORD="$CODESIGN_P12_PASSWORD"
          if ! openssl pkcs12 -in "$SIGNING_P12" -nocerts -nodes \
            -passin env:PORTSIDE_P12_PASSWORD -out "$SIGNING_PRIVATE_KEY" 2>/dev/null; then
            echo "Unable to decrypt the Developer ID PKCS#12; verify PORTSIDE_CODESIGN_P12_PASSWORD" >&2
            exit 1
          fi
          private_key_hash="$(openssl pkey -in "$SIGNING_PRIVATE_KEY" -pubout -outform der 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          if openssl pkcs12 -in "$SIGNING_P12" -clcerts -nokeys \
            -passin env:PORTSIDE_P12_PASSWORD -out "$SIGNING_EMBEDDED_CERT" 2>/dev/null \
            && openssl x509 -in "$SIGNING_EMBEDDED_CERT" -noout >/dev/null 2>&1; then
            embedded_certificate_key_hash="$(openssl x509 -in "$SIGNING_EMBEDDED_CERT" -pubkey -noout | openssl pkey -pubin -outform der 2>/dev/null | shasum -a 256 | awk '{print $1}')"
            if [ "$private_key_hash" = "$embedded_certificate_key_hash" ]; then
              cp "$SIGNING_EMBEDDED_CERT" "$SIGNING_CERT"
              security import "$SIGNING_CERT" -A -f pemseq -t cert -k "$SIGNING_KEYCHAIN" || true
              security set-key-partition-list -S apple-tool:,apple: -s -k '' "$SIGNING_KEYCHAIN"
              if security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep -F "$PORTSIDE_CODESIGN_IDENTITY"; then
                exit 0
              fi
            fi
          fi
          certificate_key_hash="$(openssl x509 -in "$SIGNING_CERT" -pubkey -noout | openssl pkey -pubin -outform der 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          test -n "$private_key_hash" && test -n "$certificate_key_hash"
          if [ "$private_key_hash" != "$certificate_key_hash" ]; then
            echo "Developer ID certificate does not match the exported private key" >&2
            exit 1
          fi
          openssl pkcs12 -export -inkey "$SIGNING_PRIVATE_KEY" -in "$SIGNING_CERT" \
            -name "$PORTSIDE_CODESIGN_IDENTITY" -passout env:PORTSIDE_P12_PASSWORD \
            -out "$SIGNING_COMBINED_P12" 2>/dev/null
          security import "$SIGNING_COMBINED_P12" -P "$CODESIGN_P12_PASSWORD" -A -f pkcs12 -k "$SIGNING_KEYCHAIN"
          signing_identity="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          test -n "$signing_identity"
          printf 'PORTSIDE_CODESIGN_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"

      - name: Build unsigned configured app
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
        run: ./scripts/build_release.sh

      - name: Sign application and generate provenance
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
          PORTSIDE_RUNTIME_MANIFEST_INPUT: ${{ runner.temp }}/portside-release/runtime-manifest-unsigned.json
          PORTSIDE_MANIFEST_SIGNING_KEY_FILE: ${{ runner.temp }}/portside-manifest-ed25519.key
        run: ./scripts/sign_release.sh

      - name: Notarize and staple app, ZIP and DMG
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
        run: ./scripts/notarize_release.sh

      - name: Validate final signed bundle metadata
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
        run: ./scripts/validate_release_bundle.sh

      - name: Generate signed production appcast
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
          PORTSIDE_UPDATES_DIR: ${{ runner.temp }}/portside-release/updates
          PORTSIDE_APPCAST_OUTPUT: ${{ runner.temp }}/portside-release/appcast.xml
          PORTSIDE_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/portside-sparkle-ed25519.key
          # Customer downloads must go through the Portside API proxy, which
          # authorizes the release and returns a short-lived storage URL.
          PORTSIDE_DOWNLOAD_URL_PREFIX: ${{ secrets.PORTSIDE_API_BASE_URL }}/app/production/
          SPARKLE_BIN: apps/desktop/.build/artifacts/sparkle/Sparkle/bin
        run: |
          set -eu
          mkdir -p "$PORTSIDE_UPDATES_DIR"
          cp "$PORTSIDE_BUILD_DIR/Portside-${PORTSIDE_VERSION}-notarized.zip" "$PORTSIDE_UPDATES_DIR/"
          printf '%s\n' "Portside ${PORTSIDE_VERSION}: performance, stability and compatibility improvements." > "$PORTSIDE_UPDATES_DIR/Portside-${PORTSIDE_VERSION}-notarized.md"
          ./scripts/generate_appcast.sh

      - name: Publish production artifacts to both Portside buckets
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
          PORTSIDE_RUNTIME_VERSION: ${{ steps.runtime-evidence.outputs.runtime_version }}
          PORTSIDE_SKIP_RUNTIME_ARCHIVES: "1"
        run: ./scripts/publish_release.sh

      - name: Upload signed production release record
        uses: actions/upload-artifact@v7
        with:
          name: portside-release-${{ steps.release-version.outputs.version }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/portside-release

      - name: Remove CI-only private keys
        if: ${{ always() }}
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/portside-notary-key.p8" \
            "$RUNNER_TEMP/portside-sparkle-ed25519.key" \
            "$RUNNER_TEMP/portside-manifest-ed25519.key"

  register-production:
    name: Register production release
    needs: build-and-publish-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      PORTSIDE_VERSION: ${{ needs.build-and-publish-production.outputs.version }}
      PORTSIDE_RUNTIME_RUN_ID: ${{ needs.build-and-publish-production.outputs.runtime_run_id }}
      API_URL: ${{ secrets.PORTSIDE_API_BASE_URL }}
      ADMIN_TOKEN: ${{ secrets.PORTSIDE_ADMIN_BEARER_TOKEN }}
      # Store the API proxy URL in AppRelease. The backend signs the private
      # object-storage request only after the release has been registered.
      RELEASE_URL: ${{ secrets.PORTSIDE_API_BASE_URL }}/app/production/Portside-${{ needs.build-and-publish-production.outputs.version }}.zip
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7

      - name: Download production release record
        uses: actions/download-artifact@v7
        with:
          name: portside-release-${{ needs.build-and-publish-production.outputs.version }}
          path: ${{ runner.temp }}/portside-release

      - name: Register the published production runtime
        env:
          PORTSIDE_RUNTIME_BUILD_DIR: ${{ runner.temp }}/portside-release
          PORTSIDE_API_BASE_URL: ${{ secrets.PORTSIDE_API_BASE_URL }}
          PORTSIDE_ADMIN_BEARER_TOKEN: ${{ secrets.PORTSIDE_ADMIN_BEARER_TOKEN }}
          PORTSIDE_RUNTIME_RUN_ID: ${{ needs.build-and-publish-production.outputs.runtime_run_id }}
        run: ./scripts/register_runtime_release.sh

      - name: Register production release in the backend
        env:
          PORTSIDE_BUILD_DIR: ${{ runner.temp }}/portside-release
        run: |
          set -eu
          test -n "$API_URL"
          test -n "$ADMIN_TOKEN"
          test -n "$RELEASE_URL"
          metadata="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const xml = readFileSync(process.env.PORTSIDE_BUILD_DIR + '/appcast.xml', 'utf8');
          const enclosure = xml.match(/<enclosure\b([^>]+)>/i)?.[1] ?? '';
          const attr = (name) => enclosure.match(new RegExp(name + '="([^"]+)"', 'i'))?.[1] ?? '';
          const decoded = (value) => value.replaceAll('&quot;', '"').replaceAll('&amp;', '&');
          const result = { length: Number(attr('length')), edSignature: decoded(attr('sparkle:edSignature')) };
          if (!Number.isSafeInteger(result.length) || result.length <= 0 || !result.edSignature) process.exit(1);
          process.stdout.write(JSON.stringify(result));
          NODE
          )"
          length="$(printf '%s' "$metadata" | jq -r '.length')"
          signature="$(printf '%s' "$metadata" | jq -r '.edSignature')"
          response_file="$RUNNER_TEMP/portside-app-release-registration.json"
          http_code="$(curl --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg version "$PORTSIDE_VERSION" --arg url "$RELEASE_URL" --arg signature "$signature" --argjson length "$length" '{version:$version,build:$version,channel:"production",url:$url,length:$length,edSignature:$signature,minimumOSVersion:"13.0",releaseNotes:("Portside " + $version + ": performance, stability and compatibility improvements.")}')" \
            -o "$response_file" -w '%{http_code}' \
            "$API_URL/v1/admin/app-releases/register")"
          case "$http_code" in
            2??) ;;
            *)
              error_body="$(jq -c '{statusCode,error,message}' "$response_file" 2>/dev/null || true)"
              [ -n "$error_body" ] || error_body="response body unavailable"
              echo "Portside API rejected app release registration (HTTP $http_code): $error_body" >&2
              exit 1
              ;;
          esac
