name: Build Desktop Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check desktop changes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.filter.outputs.should_build }}
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve tested commit
        id: target
        shell: bash
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check for desktop-related changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch requested; running desktop validation."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" \
            --jq '.files[].filename')"
          if printf '%s\n' "$files" | grep -Eq \
            '^(apps/desktop/|apps/runtime-host/|scripts/(package_app|create_dmg|build_release|sign_release|notarize_release|validate_release_bundle)\.sh$|\.github/workflows/build-desktop\.yml$)'; then
            echo "Desktop-related files changed; running validation."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No desktop-related files changed; skipping macOS validation."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.target_sha }}

      - name: Resolve desktop dependencies
        run: swift package resolve --package-path apps/desktop

      - name: Build local validation bundle (non-commercial)
        run: ./scripts/package_app.sh

      - name: Create validation archives (not for customer distribution)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Portside.app build/Portside-validation.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/Portside.app.dSYM build/Portside.app.dSYM.zip
          ./scripts/create_dmg.sh \
            build/Portside.app \
            build/Portside-validation.dmg \
            Portside
          shasum -a 256 \
            build/Portside-validation.app.zip \
            build/Portside-validation.dmg \
            build/Portside.app.dSYM.zip \
            > build/checksums.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Portside-desktop-validation-${{ needs.changes.outputs.target_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Portside-validation.app.zip
            build/Portside-validation.dmg
            build/Portside.app.dSYM.zip
            build/checksums.txt
