name: Build Desktop

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-desktop:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve desktop dependencies
        run: swift package resolve --package-path apps/desktop

      - name: Build and package Portside.app
        run: ./scripts/package_app.sh

      - name: Create distributable archives
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Portside.app build/Portside.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/Portside.app.dSYM build/Portside.app.dSYM.zip
          hdiutil create \
            -volname Portside \
            -srcfolder build/Portside.app \
            -ov \
            -format UDZO \
            build/Portside.dmg
          shasum -a 256 \
            build/Portside.app.zip \
            build/Portside.dmg \
            build/Portside.app.dSYM.zip \
            > build/checksums.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Portside-desktop-${{ github.event.workflow_run.head_sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Portside.app.zip
            build/Portside.dmg
            build/Portside.app.dSYM.zip
            build/checksums.txt
