name: Sync Upstreams

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstreams
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require upstream synchronization token
        env:
          PORTSIDE_UPSTREAM_SYNC_TOKEN: ${{ secrets.PORTSIDE_UPSTREAM_SYNC_TOKEN }}
        run: |
          [ -n "$PORTSIDE_UPSTREAM_SYNC_TOKEN" ] || {
            echo "PORTSIDE_UPSTREAM_SYNC_TOKEN is not configured" >&2
            exit 1
          }

      - name: Check out Portside
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PORTSIDE_UPSTREAM_SYNC_TOKEN }}

      - name: Synchronize snapshots and update source pull request
        env:
          GH_TOKEN: ${{ secrets.PORTSIDE_UPSTREAM_SYNC_TOKEN }}
        run: |
          sync_branch="automation/upstream-sync"
          sync_title="Sync upstream source snapshots"

          git fetch origin main
          if git ls-remote --exit-code --heads origin "$sync_branch" >/dev/null 2>&1; then
            git fetch origin "$sync_branch"
          fi
          git switch --force-create "$sync_branch" origin/main

          ./scripts/upstream/sync.sh

          close_obsolete_prs() {
            gh pr list \
              --state open \
              --base main \
              --limit 1000 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("automation/upstream-sync-")) | [.number, .headRefName] | @tsv' \
              | while IFS=$'\t' read -r pr_number head_ref; do
                  [ -n "$pr_number" ] || continue
                  gh pr close "$pr_number" \
                    --comment "Superseded by the current upstream synchronization pull request on ${sync_branch}."
                  echo "Closed obsolete upstream synchronization PR #$pr_number ($head_ref)."
                done
          }

          if git diff --quiet -- vendor upstream/lock.json UPSTREAM_VERSIONS.json; then
            echo "No upstream changes to propose."
            close_obsolete_prs
            existing_pr="$(gh pr list --state open --head "$sync_branch" --base main --json number --jq '.[0].number // empty')"
            if [ -n "$existing_pr" ]; then
              gh pr close "$existing_pr" \
                --comment "Closed because the current upstream snapshot is already up to date with main."
              echo "Closed obsolete upstream synchronization PR #$existing_pr."
            fi
            exit 0
          fi

          license_changes="$(jq -r '[.repositories[] | select(.licenseChangeDetected == true) | .name] | join(", ")' upstream/lock.json)"
          if [ -n "$license_changes" ]; then
            license_review_note="License or notice changes detected for: $license_changes. Review the vendor diff, notices and licensing obligations before merging."
          else
            license_review_note="No license or notice changes were detected by the inventory checksum."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor upstream/lock.json UPSTREAM_VERSIONS.json
          git commit -m "Sync upstream source snapshots"
          git push --force-with-lease --set-upstream origin "$sync_branch"
          close_obsolete_prs

          pr_body="$(cat <<EOF
          Automated source-only synchronization.

          $license_review_note

          Review commit provenance, licenses, exclusions, checksums and validation results before merging. This workflow never merges or publishes runtime artifacts.
          EOF
          )"
          existing_pr="$(gh pr list --state open --head "$sync_branch" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$sync_title" --body "$pr_body"
            echo "Updated upstream synchronization PR #$existing_pr."
          else
            gh pr create \
              --base main \
              --head "$sync_branch" \
              --title "$sync_title" \
              --body "$pr_body"
          fi
