name: Sync Upstreams

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Portside
        uses: actions/checkout@v7

      - name: Synchronize authorized source snapshots
        run: ./scripts/upstream/sync.sh

      - name: Open source update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- vendor upstream/lock.json UPSTREAM_VERSIONS.json; then
            echo "No upstream changes to propose."
            exit 0
          fi
          sync_branch="automation/upstream-sync-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$sync_branch"
          git add vendor upstream/lock.json UPSTREAM_VERSIONS.json
          git commit -m "Sync upstream source snapshots"
          git push --set-upstream origin "$sync_branch"
          gh pr create \
            --base main \
            --head "$sync_branch" \
            --title "Sync upstream source snapshots" \
            --body "Automated source-only synchronization. Review commit provenance, licenses, exclusions, checksums and validation results before merging. This workflow never merges or publishes runtime artifacts."
