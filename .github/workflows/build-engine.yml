name: Build Portside Engine

on:
  push:
    branches: [main]
    paths:
      - "vendor/wine/**"
      - "upstream/lock.json"
      - "upstream/dependencies.json"
      - "upstream/patches/**"
      - "scripts/build-runtime/build-engine.sh"
      - "scripts/build-runtime/build-wine-engine.sh"
      - "scripts/build-runtime/build-freetype.sh"
      - "scripts/build-runtime/resolve-engine.sh"
      - "scripts/build-runtime/validate-engine-execution.py"
      - "scripts/build-runtime/validate-engine-privacy.py"
      - "scripts/build-runtime/validate-publication.py"
      - "scripts/build-runtime/engine-input.py"
      - "scripts/build-runtime/prepare-engine-push.py"
      - "scripts/build-runtime/create-archive.sh"
      - "scripts/build-runtime/source-audit.sh"
      - "scripts/publish_engine.sh"
      - ".github/workflows/build-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect and validate engine sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      PORTSIDE_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_PUBLIC_BUCKET }}
      PORTSIDE_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_S3_ACCESS_KEY_ID }}
      PORTSIDE_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_S3_REGION: ${{ secrets.PORTSIDE_S3_REGION }}
      PORTSIDE_S3_ENDPOINT: ${{ secrets.PORTSIDE_S3_ENDPOINT }}
    outputs:
      build_engine: ${{ steps.detect.outputs.build_engine }}
    steps:
      - name: Check out Portside history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the engine needs rebuilding
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -eu
          if [ "$REF_NAME" != refs/heads/main ]; then
            build_engine=false
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            build_engine=true
          elif ./scripts/build-runtime/changed-components.sh engine "$BEFORE_SHA" "$HEAD_SHA"; then
            build_engine=true
          else
            build_engine=false
          fi
          printf 'build_engine=%s\n' "$build_engine" >> "$GITHUB_OUTPUT"

      - name: Validate sources and build inputs
        if: steps.detect.outputs.build_engine == 'true'
        run: |
          set -eu
          ./scripts/build-runtime/source-audit.sh
          ./scripts/upstream/validate_snapshot.sh vendor/wine
          jq -e . upstream/lock.json >/dev/null
          jq -e . upstream/dependencies.json >/dev/null
          for script in scripts/build-runtime/*.sh scripts/upstream/*.sh scripts/generate_manifest.sh scripts/publish_runtime.sh scripts/publish_engine.sh; do
            sh -n "$script"
          done
          ./scripts/validate-production-policy.sh

      - name: Fetch local engine input for this commit
        if: steps.detect.outputs.build_engine == 'true'
        run: python3 scripts/build-runtime/engine-input.py download build/engine "$GITHUB_SHA"

      - name: Transfer checked local input to native validation
        if: steps.detect.outputs.build_engine == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portside-engine-input-${{ github.run_id }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            build/engine/PortsideWineEngine-*.tar.xz
            build/engine/PortsideWineEngine-*.sha256
            build/engine/engine-metadata.json
            build/engine/engine-provenance.json

  validate-engine:
    name: Validate locally built Wine engine
    needs: changes
    if: needs.changes.outputs.build_engine == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out matching source and validation scripts
        uses: actions/checkout@v7
      - name: Select Python with safe archive extraction
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download checked local engine input
        uses: actions/download-artifact@v7
        with:
          name: portside-engine-input-${{ github.run_id }}
          path: build/engine
      - name: Execute x64 and x86 controls on the extracted local engine
        run: python3 scripts/build-runtime/engine-input.py validate-native build/engine "$GITHUB_SHA"
      - name: Retain native execution proof
        uses: actions/upload-artifact@v7
        with:
          name: portside-engine-native-validation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: build/engine/engine-validation.json

  publish-engine:
    name: Publish validated engine on Linux
    needs: validate-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PORTSIDE_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_PUBLIC_BUCKET }}
      PORTSIDE_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_S3_ACCESS_KEY_ID }}
      PORTSIDE_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_S3_REGION: ${{ secrets.PORTSIDE_S3_REGION }}
      PORTSIDE_S3_ENDPOINT: ${{ secrets.PORTSIDE_S3_ENDPOINT }}
    steps:
      - name: Check out validated sources
        uses: actions/checkout@v7
      - name: Download checked local engine input
        uses: actions/download-artifact@v7
        with:
          name: portside-engine-input-${{ github.run_id }}
          path: build/engine
      - name: Download native execution proof
        uses: actions/download-artifact@v7
        with:
          name: portside-engine-native-validation-${{ github.run_id }}
          path: build/engine
      - name: Validate transferred engine and publication tools
        run: |
          set -eu
          command -v aws
          python3 scripts/build-runtime/validate-publication.py engine build/engine
          ./scripts/validate-production-policy.sh
      - name: Publish validated engine
        env:
          PORTSIDE_ENGINE_BUILD_DIR: ${{ github.workspace }}/build/engine
        run: |
          engine_version="$(./scripts/build-runtime/resolve-engine.sh | jq -r '.engineVersion')"
          PORTSIDE_ENGINE_VERSION="$engine_version" ./scripts/publish_engine.sh

      - name: Retain published engine evidence
        uses: actions/upload-artifact@v7
        with:
          name: portside-engine-${{ github.run_number }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            build/engine/PortsideWineEngine-*.tar.xz
            build/engine/PortsideWineEngine-*.sha256
            build/engine/engine-metadata.json
            build/engine/engine-provenance.json
            build/engine/engine-validation.json
