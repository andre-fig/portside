name: Build Portside Runtime
run-name: Runtime production ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - "upstream/**"
      - "apps/runtime-host/**"
      - "apps/desktop/**"
      - "runtime/wrapper-template/**"
      - "scripts/build-runtime/**"
      - "scripts/generate_manifest.sh"
      - "scripts/publish_runtime.sh"
      - "scripts/*release*.sh"
      - "scripts/package_app.sh"
      - "scripts/create_dmg.sh"
      - "scripts/generate_appcast.sh"
      - "scripts/wait_for_runtime.py"
      - ".github/workflows/release-production.yml"
      - ".github/workflows/build-runtime.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Portside runtime version"
        required: true
        type: string
      artifact_url_prefix:
        description: "HTTPS Portside API production runtime download URL prefix"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-runtime-${{ github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    name: Prepare approved runtime inputs on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PORTSIDE_RUNTIME_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
    outputs:
      assemble_runtime: ${{ steps.detect.outputs.assemble_runtime }}
    steps:
      - name: Check out Portside history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Decide whether the runtime should be assembled
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -eu
          assemble_runtime=false
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REF_NAME" = refs/heads/main ]; then
            assemble_runtime=true
          elif [ "$EVENT_NAME" = push ] && [ "$REF_NAME" = refs/heads/main ]; then
            runtime_changed=false
            engine_changed=false
            if ./scripts/build-runtime/changed-components.sh assembly "$BEFORE_SHA" "$HEAD_SHA"; then runtime_changed=true; fi
            if ./scripts/build-runtime/changed-components.sh engine "$BEFORE_SHA" "$HEAD_SHA"; then engine_changed=true; fi
            if [ "$runtime_changed" = true ] && [ "$engine_changed" = false ]; then
              assemble_runtime=true
            fi
          fi
          printf 'assemble_runtime=%s\n' "$assemble_runtime" >> "$GITHUB_OUTPUT"

      - name: Validate sources, snapshots and build inputs
        if: steps.detect.outputs.assemble_runtime == 'true'
        run: |
          set -eu
          ./scripts/build-runtime/source-audit.sh
          ./scripts/upstream/validate_snapshot.sh vendor/wine
          ./scripts/upstream/validate_snapshot.sh vendor/winetricks
          jq -e . upstream/lock.json >/dev/null
          jq -e . upstream/dependencies.json >/dev/null
          for script in \
            scripts/build-runtime/*.sh \
            scripts/upstream/*.sh \
            scripts/generate_manifest.sh \
            scripts/publish_runtime.sh \
            scripts/publish_engine.sh; do
            sh -n "$script"
          done
          ./scripts/validate-production-policy.sh

      - name: Prepare the approved runtime inputs on Linux
        if: steps.detect.outputs.assemble_runtime == 'true'
        run: |
          set -eu
          python3 scripts/build-runtime/sikarugir-inputs.py prepare build/sikarugir-inputs

      - name: Transfer approved inputs to native assembly
        if: steps.detect.outputs.assemble_runtime == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-inputs-${{ github.run_id }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: build/sikarugir-inputs/

  build-runtime:
    name: Assemble and validate production runtime
    needs: changes
    if: needs.changes.outputs.assemble_runtime == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    environment: production
    env:
      PORTSIDE_RUNTIME_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
      PORTSIDE_RUNTIME_CHANNEL: production
      PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX: ${{ inputs.artifact_url_prefix || secrets.PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX }}
      PORTSIDE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY_ID }}
      PORTSIDE_RUNTIME_INTEGRATION: sikarugir
      PORTSIDE_CODESIGN_IDENTITY: ${{ secrets.PORTSIDE_CODESIGN_IDENTITY }}
    steps:
      - name: Check out Portside sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up archive validation Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select fixed toolchain
        run: |
          set -eu
          sw_vers -productVersion
          xcode-select -p
          xcodebuild -version
          clang --version
          swift --version
          for tool in clang clang++ make tar shasum jq node swiftc; do command -v "$tool"; done

      - name: Verify native assembly tools
        run: |
          set -eu
          for tool in jq node python3 swiftc lipo tar shasum; do command -v "$tool"; done

      - name: Download approved inputs for this workflow
        uses: actions/download-artifact@v7
        with:
          name: portside-runtime-inputs-${{ github.run_id }}
          path: build/sikarugir-inputs

      - name: Authenticate transferred inputs before assembly
        run: python3 scripts/build-runtime/sikarugir-inputs.py verify build/sikarugir-inputs

      - name: Validate production publication inputs
        run: |
          set -eu
          require_env() {
            variable="$1"
            eval "value=\${$variable-}"
            if [ -z "$value" ]; then
              echo "missing required validation secret: $variable" >&2
              exit 1
            fi
          }
          for variable in \
            PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX \
            PORTSIDE_MANIFEST_SIGNING_KEY_ID; do
            require_env "$variable"
          done
          case "$PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX" in
            https://*/v1/runtime/artifacts/production/) ;;
            *) echo "runtime download prefix must use the Portside production signed-download route" >&2; exit 1;;
          esac

      - name: Import runtime signing identity
        env:
          CODESIGN_P12_BASE64: ${{ secrets.PORTSIDE_CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.PORTSIDE_CODESIGN_P12_PASSWORD }}
          CODESIGN_CERT_PEM: ${{ secrets.PORTSIDE_CODESIGN_CERTIFICATE_PEM }}
          CODESIGN_CERT_BASE64: ${{ secrets.PORTSIDE_CODESIGN_CERTIFICATE_BASE64 }}
        run: ./scripts/build-runtime/import-runtime-signing-identity.sh

      - name: Assemble original Sikarugir and validate the desktop installer
        run: ./scripts/build-runtime/build.sh

      - name: Upload validated runtime assembly
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-assembly-production-${{ env.PORTSIDE_RUNTIME_VERSION }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            build/runtime/Portside*.tar.xz
            build/runtime/Portside*.sha256
            build/runtime/runtime-manifest-unsigned.json
            build/runtime/engine-input.json
            build/runtime/provenance.json
            build/runtime/sbom.spdx.json
            build/runtime/native-validation.json

      - name: Remove temporary runtime signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/portside-runtime-signing.keychain-db" || true

  publish-runtime:
    name: Sign and publish production runtime on Linux
    needs: build-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PORTSIDE_RUNTIME_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
      PORTSIDE_RUNTIME_CHANNEL: production
      PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX: ${{ inputs.artifact_url_prefix || secrets.PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX }}
      PORTSIDE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY_ID }}
      PORTSIDE_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_PUBLIC_BUCKET }}
      PORTSIDE_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_S3_ACCESS_KEY_ID }}
      PORTSIDE_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_S3_REGION: ${{ secrets.PORTSIDE_S3_REGION }}
      PORTSIDE_S3_ENDPOINT: ${{ secrets.PORTSIDE_S3_ENDPOINT }}
    steps:
      - name: Check out validated sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download validated runtime assembly
        uses: actions/download-artifact@v7
        with:
          name: portside-runtime-assembly-production-${{ env.PORTSIDE_RUNTIME_VERSION }}
          path: build/runtime
      - name: Validate transferred runtime and publication tools
        run: |
          set -eu
          for tool in aws jq node python3; do command -v "$tool"; done
          python3 scripts/build-runtime/validate-publication.py runtime build/runtime
      - name: Materialize validation manifest signing key
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$MANIFEST_PRIVATE_KEY"
          umask 077
          printf '%s' "$MANIFEST_PRIVATE_KEY" > "$RUNNER_TEMP/portside-runtime-manifest.key"

      - name: Sign and validate production manifest
        env:
          PORTSIDE_RUNTIME_MANIFEST_INPUT: ${{ github.workspace }}/build/runtime/runtime-manifest-unsigned.json
          PORTSIDE_MANIFEST_SIGNING_KEY_FILE: ${{ runner.temp }}/portside-runtime-manifest.key
          PORTSIDE_MANIFEST_OUTPUT: ${{ github.workspace }}/build/runtime/runtime-manifest.json
        run: |
          ./scripts/generate_manifest.sh
          ./scripts/build-runtime/validate-manifest.sh "$PORTSIDE_MANIFEST_OUTPUT"

      - name: Publish production runtime
        env:
          PORTSIDE_RUNTIME_BUILD_DIR: ${{ github.workspace }}/build/runtime
        run: ./scripts/publish_runtime.sh

      - name: Run production artifact and source policy checks
        run: |
          ./scripts/validate-production-policy.sh
          test -s "build/runtime/PortsideWrapper-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/PortsideWineEngine-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/PortsideWinetricks-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/engine-input.json"
          test -s "build/runtime/sbom.spdx.json"
          test -s "build/runtime/provenance.json"

      - name: Upload production runtime evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-production-${{ env.PORTSIDE_RUNTIME_VERSION }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            build/runtime/Portside*.tar.xz
            build/runtime/Portside*.sha256
            build/runtime/runtime-manifest-unsigned.json
            build/runtime/engine-input.json
            build/runtime/provenance.json
            build/runtime/sbom.spdx.json
            build/runtime/native-validation.json
            build/runtime/runtime-manifest.json

      - name: Upload runtime metadata for release orchestration
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-metadata-production-${{ env.PORTSIDE_RUNTIME_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/runtime/runtime-manifest-unsigned.json
            build/runtime/runtime-manifest.json
            build/runtime/engine-input.json
            build/runtime/provenance.json
            build/runtime/sbom.spdx.json
            build/runtime/native-validation.json

      - name: Remove temporary manifest signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/portside-runtime-manifest.key"
