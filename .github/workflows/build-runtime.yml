name: Build Portside Runtime

on:
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - "upstream/lock.json"
      - "upstream/dependencies.json"
      - "apps/runtime-host/**"
      - "runtime/wrapper-template/**"
      - "scripts/build-runtime/**"
      - "scripts/generate_manifest.sh"
  workflow_dispatch:
    inputs:
      version:
        description: "Portside runtime version"
        required: true
        type: string
      artifact_url_prefix:
        description: "HTTPS Portside API runtime download URL prefix, including the runtime channel path"
        required: true
        type: string
      force_rebuild:
        description: "Ignore the Wine cache and rebuild the engine from source"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build and publish validation runtime
    runs-on: macos-15
    timeout-minutes: 180
    environment: production
    env:
      PORTSIDE_RUNTIME_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
      PORTSIDE_RUNTIME_CHANNEL: staging
      PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX: ${{ inputs.artifact_url_prefix || secrets.PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX }}
      PORTSIDE_MANIFEST_SIGNING_KEY_ID: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY_ID }}
      PORTSIDE_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_PUBLIC_BUCKET }}
      PORTSIDE_SECONDARY_PUBLIC_BUCKET: ${{ secrets.PORTSIDE_SECONDARY_PUBLIC_BUCKET }}
      PORTSIDE_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_S3_ACCESS_KEY_ID }}
      PORTSIDE_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_S3_REGION: ${{ secrets.PORTSIDE_S3_REGION }}
      PORTSIDE_S3_ENDPOINT: ${{ secrets.PORTSIDE_S3_ENDPOINT }}
      PORTSIDE_SECONDARY_S3_ACCESS_KEY_ID: ${{ secrets.PORTSIDE_SECONDARY_S3_ACCESS_KEY_ID }}
      PORTSIDE_SECONDARY_S3_SECRET_ACCESS_KEY: ${{ secrets.PORTSIDE_SECONDARY_S3_SECRET_ACCESS_KEY }}
      PORTSIDE_SECONDARY_S3_REGION: ${{ secrets.PORTSIDE_SECONDARY_S3_REGION }}
      PORTSIDE_SECONDARY_S3_ENDPOINT: ${{ secrets.PORTSIDE_SECONDARY_S3_ENDPOINT }}
    steps:
      - name: Check out Portside sources
        uses: actions/checkout@v7

      - name: Select fixed toolchain
        run: |
          set -eu
          sw_vers -productVersion
          xcode-select -p
          xcodebuild -version
          clang --version
          swift --version
          for tool in clang clang++ make tar shasum jq node swiftc; do command -v "$tool"; done

      - name: Install pinned runtime toolchain
        run: |
          for formula in awscli bison mingw-w64 llvm lld freetype pkgconf; do brew list "$formula" >/dev/null 2>&1 || brew install "$formula"; done
          aws --version
          printf 'bison: '; "$(brew --prefix bison)/bin/bison" --version | awk 'NR==1 {print}'
          for formula in mingw-w64 llvm lld freetype pkgconf; do brew list --versions "$formula"; done

      - name: Restore cached Wine engine
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/portside-wine-cache
          key: portside-wine-${{ runner.os }}-macos-15-${{ hashFiles('upstream/lock.json', 'scripts/build-runtime/build-wine-engine.sh') }}
          restore-keys: |
            portside-wine-${{ runner.os }}-macos-15-

      - name: Validate validation publication inputs
        run: |
          set -eu
          require_env() {
            variable="$1"
            eval "value=\${$variable-}"
            if [ -z "$value" ]; then
              echo "missing required validation secret: $variable" >&2
              exit 1
            fi
          }
          for variable in \
            PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX \
            PORTSIDE_MANIFEST_SIGNING_KEY_ID \
            PORTSIDE_PUBLIC_BUCKET \
            PORTSIDE_SECONDARY_PUBLIC_BUCKET \
            PORTSIDE_S3_ACCESS_KEY_ID \
            PORTSIDE_S3_SECRET_ACCESS_KEY \
            PORTSIDE_S3_REGION \
            PORTSIDE_S3_ENDPOINT \
            PORTSIDE_SECONDARY_S3_ACCESS_KEY_ID \
            PORTSIDE_SECONDARY_S3_SECRET_ACCESS_KEY \
            PORTSIDE_SECONDARY_S3_REGION \
            PORTSIDE_SECONDARY_S3_ENDPOINT; do
            require_env "$variable"
          done
          case "$PORTSIDE_RUNTIME_DOWNLOAD_URL_PREFIX" in
            https://*/v1/runtime/artifacts/staging/) ;;
            *) echo "runtime download prefix must use the Portside signed-download route" >&2; exit 1;;
          esac

      - name: Assemble wrapper, cached engine and winetricks from local sources
        env:
          PORTSIDE_WINE_CACHE_DIR: ${{ runner.temp }}/portside-wine-cache
          PORTSIDE_WINE_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: ./scripts/build-runtime/build.sh

      - name: Materialize validation manifest signing key
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.PORTSIDE_MANIFEST_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$MANIFEST_PRIVATE_KEY"
          umask 077
          printf '%s' "$MANIFEST_PRIVATE_KEY" > "$RUNNER_TEMP/portside-runtime-manifest.key"

      - name: Sign and validate validation manifest
        env:
          PORTSIDE_RUNTIME_MANIFEST_INPUT: ${{ github.workspace }}/build/runtime/runtime-manifest-unsigned.json
          PORTSIDE_MANIFEST_SIGNING_KEY_FILE: ${{ runner.temp }}/portside-runtime-manifest.key
          PORTSIDE_MANIFEST_OUTPUT: ${{ github.workspace }}/build/runtime/runtime-manifest.json
        run: |
          ./scripts/generate_manifest.sh
          ./scripts/build-runtime/validate-manifest.sh "$PORTSIDE_MANIFEST_OUTPUT"

      - name: Publish validation runtime to both buckets
        env:
          PORTSIDE_RUNTIME_BUILD_DIR: ${{ github.workspace }}/build/runtime
        run: ./scripts/publish_runtime_staging.sh

      - name: Run artifact and source policy checks
        run: |
          ./scripts/validate-production-policy.sh
          test -s "build/runtime/PortsideWrapper-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/PortsideWineEngine-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/PortsideWinetricks-${PORTSIDE_RUNTIME_VERSION}.tar.xz"
          test -s "build/runtime/sbom.spdx.json"
          test -s "build/runtime/provenance.json"

      - name: Upload validation evidence
        if: ${{ always() && hashFiles('build/runtime/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-staging-${{ env.PORTSIDE_RUNTIME_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: build/runtime/

      - name: Upload runtime metadata for release orchestration
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: portside-runtime-metadata-staging-${{ env.PORTSIDE_RUNTIME_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/runtime/runtime-manifest-unsigned.json
            build/runtime/runtime-manifest.json
            build/runtime/provenance.json
            build/runtime/sbom.spdx.json
